<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>튀김이 식기 전에 — Before the Fries Get Cold</title>
  <meta name="description" content="퇴근길에 들른 새 감자튀김집 FF-1204. 나와 보니 밤이었다 — 돌아가는 길에, 있어서는 안 되는 것들이 서 있다." />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100dvh; overflow: hidden;
      background: #0a0e1a; color: #d8d8e0;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none;
      overscroll-behavior: none;        /* 당겨서 새로고침 방지 (Android Chrome) */
      -webkit-touch-callout: none;      /* 길게 눌러 메뉴 방지 (iOS) */
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* ---------- HUD ---------- */
    #hud { position: fixed; inset: 0; pointer-events: none; }
    /* 비네트 — 시야 가장자리를 아주 옅게 조인다 (분위기 프레임.
       이상현상은 광원 안쪽 배치 원칙이라 판정 공정성과 충돌하지 않음 — anomalies.md 배치 3원칙) */
    #hud::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 45%, transparent 62%, rgba(4, 6, 12, 0.22) 100%);
    }
    #status {
      position: absolute; top: max(12px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left));
      font-size: clamp(12px, 1.6vw, 15px); letter-spacing: 0.06em; opacity: 0.85;
      text-shadow: 0 1px 4px #000;
      border-left: 2px solid rgba(255, 178, 62, 0.35); padding-left: 9px; /* 이정표 — 웜 = 목표 (visual-polish §3) */
      transition: opacity 0.32s; /* 접힘 카운터 교체 페이드 (hud.setStatusFold) */
    }
    #reticle { /* 지적 크로스헤어 — 어포던스: 짚을 수 있다는 신호 (걷는 동안만, hud.setReticle) */
      position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
      border-radius: 50%; background: #d8d8e0; opacity: 0; transition: opacity 0.4s;
    }
    #msg {
      position: absolute; left: 50%; bottom: 18%; transform: translateX(-50%);
      max-width: min(86vw, 640px); text-align: center; white-space: pre-line;
      font-size: clamp(14px, 2vw, 18px); line-height: 1.6;
      opacity: 0; transition: opacity 0.6s;
      /* 자막은 **밝은 바닥 위에서도** 읽혀야 한다 — 아침 튜토리얼의 흰 횡단보도 위에서
         그림자 한 겹(0 1px 6px)으로는 글자가 묻혔다 (v0.11.27 실측). 어둠을 한 겹 더 깐다 */
      text-shadow: 0 1px 6px #000, 0 0 14px rgba(0, 0, 0, 0.85), 0 0 3px rgba(0, 0, 0, 0.9);
    }

    /* ---------- 오버레이 공통 ---------- */
    .overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #06080f; text-align: center; padding: 24px; z-index: 10;
      transition: opacity 0.8s;
      /* 한국어는 기본값(word-break: normal)에서 **어절 한가운데도 끊는다** —
         모바일에서 "감자튀김집."이 "감자튀김 / 집."으로 갈라졌다. keep-all이 한국어 표준 */
      word-break: keep-all; overflow-wrap: break-word;
    }
    /* flex 행의 레이블("밝기"·"소리")은 줄이지 않는다 — 좁은 화면에서 두 글자가
       세로로 쪼개졌다 ("밝 / 기"). 익명 flex 아이템은 스타일이 안 먹어 span으로 감쌌다 */
    .overlay .lbl { flex-shrink: 0; }
    /* 숨긴 오버레이는 자식(버튼)까지 클릭 차단 — 자식의 pointer-events:auto가
       부모의 none을 다시 켜서, 투명한 버튼이 아래 층 버튼을 가로채는 것 방지 */
    .overlay.hidden, .overlay.hidden * { opacity: 0; pointer-events: none !important; }
    .overlay h1 {
      font-size: clamp(22px, 4.5vw, 34px); font-weight: 700; letter-spacing: 0.04em;
      /* 간판의 온기 — 웜 글로우는 아주 옅게 (웜 컬러 10% 원칙, visual-polish §3) */
      text-shadow: 0 0 28px rgba(255, 178, 62, 0.16), 0 1px 6px #000;
    }
    .overlay .clock { /* 새벽의 시각 — 프롤로그 폰 상태바(01:04)와 같은 시간 (디제틱 앵커) */
      font-size: clamp(11px, 1.6vw, 13px); letter-spacing: 0.34em; padding-left: 0.34em;
      color: rgba(255, 178, 62, 0.5);
    }
    .overlay .sub { font-size: clamp(12px, 2vw, 15px); opacity: 0.55; line-height: 1.8; }
    /* 영문 부제 — 한글 제목의 그림자 정도로만. 읽히되 눈길을 끌지 않는다 */
    .overlay .eng { opacity: 0.28; letter-spacing: 0.06em; }
    .overlay .quote { font-size: clamp(13px, 2vw, 16px); opacity: 0.8; font-style: italic; }
    .overlay button {
      pointer-events: auto; cursor: pointer; margin-top: 10px;
      background: #ffb23e; color: #201404; border: none; border-radius: 8px;
      padding: 12px 28px; font-size: clamp(14px, 2vw, 16px); font-weight: 700;
      min-width: 44px; min-height: 44px;
      transition: filter 0.25s;
      /* 숨쉬는 온기 — 팝·바운스 금지, 느린 명멸만 (visual-polish §2·§7) */
      animation: breathe 3.4s ease-in-out infinite alternate;
    }
    .overlay button:hover { filter: brightness(1.08); }
    @keyframes breathe {
      from { box-shadow: 0 0 0 rgba(255, 178, 62, 0); }
      to { box-shadow: 0 0 24px rgba(255, 178, 62, 0.26); }
    }
    .overlay button.ghost, .overlay a.ghost {
      background: none; color: #8b90a8; font-weight: 400;
      font-size: clamp(11px, 1.6vw, 13px); padding: 8px 12px; margin-top: 0;
      text-decoration: underline; text-underline-offset: 3px;
      animation: none; /* 숨쉬는 글로우는 주 행동 버튼만 */
    }
    .overlay a.ghost { display: inline-block; pointer-events: auto; cursor: pointer; }
    .overlay .fineprint { font-size: clamp(10px, 1.4vw, 12px); opacity: 0.35; }
    .overlay .fineprint a { color: inherit; pointer-events: auto; }

    /* ---------- 통증 비네트 — 깊이(약 기운 떨어짐)의 신체 감각화 ----------
       저채도 적 (팔레트: 어긋남 전용색). 판정 정보를 가리지 않게 가장자리만, 최대 0.55 */
    #pain {
      position: fixed; inset: 0; pointer-events: none; z-index: 4; opacity: 0;
      background: radial-gradient(ellipse at 50% 50%, transparent 52%, rgba(90, 15, 15, 0.5) 100%);
      transition: opacity 1.4s;
    }
    #pain.acute { animation: painPulse 3.6s ease-in-out infinite alternate; }
    @keyframes painPulse {
      from { transform: scale(1); }
      to { transform: scale(1.045); }
    }

    /* 접이식 설정 (밝기·소리) — 타이틀 첫인상을 해치지 않게 기본 접힘 (visual-polish §1) */
    #settings-panel { display: none; flex-direction: column; align-items: center; gap: 14px; }
    #settings-panel.open { display: flex; }
    /* 설정 한 항목 = 조작 줄 + 설명 줄, 둘 다 가운데. 항목 사이는 아주 옅은 실선으로 나눈다 */
    .set-item { display: flex; flex-direction: column; align-items: center; gap: 7px; }
    .set-item + .set-item { border-top: 1px solid rgba(42, 49, 72, 0.5); padding-top: 14px; }
    .set-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .set-help {
      font-size: clamp(11px, 1.7vw, 13px); opacity: 0.55; line-height: 1.7;
      max-width: 30em; /* 긴 설명이 화면 폭을 다 쓰면 가운데 정렬이 안 보인다 */
    }

    /* 밝기 미리보기 — 슬라이더를 잡는 동안 시작 화면이 걷혀 실제 골목이 보인다 */
    #start { transition: opacity 0.8s, background-color 0.35s; }
    #start > *, #settings-panel > * { transition: opacity 0.3s; }
    #start.peek { background-color: transparent; }
    #start.peek > :not(#settings-panel),
    #start.peek #settings-panel > :not(.bright-row) { opacity: 0; pointer-events: none; }
    #start.peek .bright-row { text-shadow: 0 1px 4px #000; }

    /* 사운드 토글 — 시작 화면 설정 줄 (게임 화면에는 아무것도 띄우지 않는다) */
    #sound-btn {
      pointer-events: auto; cursor: pointer; min-width: 44px; min-height: 40px;
      margin-top: 0; background: rgba(12, 16, 30, 0.55); color: #d8d8e0;
      border: 1px solid #2a3148; border-radius: 10px;
      font-size: 18px; line-height: 1; padding: 6px 10px; font-weight: 400;
      animation: none;
    }
    #fade {
      position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none;
      transition: opacity 1.2s; z-index: 5;
    }

    /* 방문 도장 카드 — 진행(밤)의 디제틱 표시. 무료 쿠폰 약속은 폐지 (v0.11.6) */
    #coupon {
      border: 1px dashed rgba(255, 178, 62, 0.38); border-radius: 10px;
      padding: 9px 20px 11px; display: flex; flex-direction: column; gap: 3px;
      font-size: clamp(11px, 1.6vw, 13px); color: #8b90a8; letter-spacing: 0.04em;
    }
    #coupon .c-stamps {
      font-size: clamp(15px, 2.2vw, 19px); letter-spacing: 0.3em; padding-left: 0.3em;
      color: rgba(255, 178, 62, 0.75);
    }
    #coupon .c-stamps .empty { color: #2a3148; }

    /* 온보딩 조작 힌트 (1일차 — 조작은 타이틀이 아니라 스테이지 안에서 배운다) —
       상단 카운터 아래 (하단 자막 #msg·걷기 버튼과 겹치지 않는 자리), 줄바꿈 허용 */
    #touch-hint {
      position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 36px);
      left: 50%; transform: translateX(-50%); width: max-content; max-width: 82vw;
      font-size: 12px; line-height: 1.7; opacity: 0.4; display: none;
      text-align: center; text-shadow: 0 1px 4px #000;
    }

    /* ---------- 걷기 버튼 (모바일) — 직진뿐이라 조향이 필요 없다: 누르는 동안 걷는다 ----------
       왼손 엄지 = 걷기 홀드, 오른손(화면 어디든) 드래그 = 시점, 탭 = 확인.
       달리기 없음 — 조작은 홀드 하나 (v0.11.2). 조이스틱 폐지 (responsive-design §1) */
    #walk-btn {
      pointer-events: auto; display: none; position: absolute;
      left: max(22px, env(safe-area-inset-left)); bottom: max(26px, env(safe-area-inset-bottom));
      width: 96px; height: 96px; border-radius: 50%;
      background: rgba(10, 14, 26, 0.45); color: #d8d8e0;
      border: 1.5px solid rgba(216, 216, 224, 0.3);
      font-family: inherit; font-size: 15px; letter-spacing: 0.1em; padding-left: 0.1em;
      align-items: center; justify-content: center;
      text-shadow: 0 1px 4px #000; touch-action: none; user-select: none;
      transition: border-color 0.25s, background-color 0.25s, transform 0.25s;
    }
    #walk-btn.held { border-color: rgba(255, 178, 62, 0.6); background: rgba(18, 20, 32, 0.55); }

    /* 터치 기기: 걷기 버튼 표시, 크로스헤어 숨김(지적은 탭 지점 — 중앙 점은 오해를 만든다),
       안내 문구는 터치용으로 교체 */
    .touch-only { display: none; }
    @media (pointer: coarse) {
      #walk-btn { display: flex; }
      #reticle { display: none; }
      .pc-only { display: none; }
      .touch-only { display: block; }
    }
  </style>
  <script type="module" crossorigin src="/fries-get-cold/assets/index-BwkrLhBw.js"></script>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div id="status"></div>
    <div id="reticle"></div>
    <div id="msg"></div>
    <div id="touch-hint"></div>
    <button id="walk-btn" aria-label="누르는 동안 걷기">걷는다</button>
  </div>

  <div id="fade"></div>
  <div id="pain"></div>

  <div id="start" class="overlay hidden">
    <h1>튀김이 식기 전에</h1>
    <!-- 영문 부제는 장식이다 — 한글 제목보다 확실히 뒤로 물린다 (v0.11.26) -->
    <div class="sub eng">Before the Fries Get Cold</div>
    <!-- 밖에 나온 명분 한 줄. 가게 이름도, 현수막도 말하지 않는다 — 퇴근길에 직접 읽는 것이
         튜토리얼의 첫 사건이다 (무설명 학습). "그게 다였다"는 회고체 — 뒤에 무엇이 있었는지는
         설명하지 않는다 (visual-polish §6: 공포를 설명하지 않는다) -->
    <div class="quote">오늘따라 감자튀김이 먹고 싶었다. 그게 다였다.</div>
    <div class="sub" id="continue-info" style="display:none"></div>
    <!-- 쿠폰 도장 카드 — 재방문(진행 있음)에만 표시: 첫 방문 타이틀은 전제 한 줄만 남긴다 (v0.9.1 타이틀 다이어트) -->
    <div id="coupon" style="display:none">
      <div>🍟 FF-1204 — 방문 도장</div>
      <div class="c-stamps"></div>
      <div class="c-note">밤마다 하나씩</div>
    </div>
    <!-- 문구는 main.ts refreshContinueUi가 상황에 맞게 교체 (첫 방문 = 퇴근길 / 재방문 = 가게에서) -->
    <!-- 실제 문구는 main.ts가 상황에 맞게 교체 (첫 방문 / 이어하기) — data.ts startBtn* -->
    <button id="start-btn">퇴근하기!</button>
    <div style="display:flex;align-items:center;justify-content:center;gap:2px;">
      <button id="settings-btn" class="ghost">⚙ 설정</button>
      <button id="reset-btn" class="ghost" style="display:none">기록 삭제 · 처음부터</button>
    </div>
    <!-- 설정 — 항목마다 [조작 줄] + [설명 줄]을 세로로 쌓고 둘 다 가운데 정렬.
         한 줄에 레이블·조작·설명을 좌우로 늘어놓으면 화면 폭마다 들쭉날쭉해진다 (v0.11.25) -->
    <div id="settings-panel">
      <div class="set-item bright-row">
        <div class="set-row">
          <span class="lbl">밝기</span>
          <input id="bright" type="range" min="0.6" max="1.9" step="0.05" value="1.0"
            style="pointer-events:auto;flex:1 1 130px;max-width:180px;accent-color:#ffb23e;" />
        </div>
        <div class="set-help">움직이는 동안 골목이 보여요 — 겨우 보일 정도가 적당</div>
      </div>
      <div class="set-item">
        <div class="set-row">
          <span class="lbl">소리</span>
          <button id="sound-btn" aria-label="소리 끄기">🔊</button>
        </div>
        <div class="set-help">게임 중에는 M 키 (PC) · 🎧 이어폰을 권장합니다</div>
      </div>
      <!-- 조작 전체 참조 — 기본 학습은 밤 1 인게임 힌트가 담당, 여기는 다시 볼 사람용 -->
      <div class="set-item">
        <div class="set-help pc-only">조작 — WASD 이동 · 마우스 시점 · 클릭 = 직시 · M 소리</div>
        <div class="set-help touch-only">조작 — 버튼 홀드 = 걷기 · 드래그 = 시점 · 탭 = 직시</div>
      </div>
    </div>
    <div class="fineprint">진행 기록과 설정은 이 기기의 브라우저에만 저장됩니다.</div>
    <a class="ghost" href="https://github.com/ff-1204/fries-get-cold/blob/main/docs/privacy.md"
      target="_blank" rel="noopener">개인정보처리방침</a>
  </div>

</body>
</html>
